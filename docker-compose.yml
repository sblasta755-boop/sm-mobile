services:
  expo:
    build:
      context: .
      target: dev
    working_dir: /app
    command: npm run start:lan
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://10.0.2.2:8000/api/v1}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - .:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  expo-tunnel:
    build:
      context: .
      target: dev
    working_dir: /app
    command: npm run start:tunnel
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://10.0.2.2:8000/api/v1}
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    profiles:
      - tunnel

  web:
    build:
      context: .
      target: web
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-/api/v1}
    ports:
      - "8088:80"
    profiles:
      - web

volumes:
  mobile_node_modules:
