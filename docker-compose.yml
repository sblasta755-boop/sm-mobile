services:
  expo:
    build:
      context: ./src
      target: dev
    working_dir: /app
    command: npm run start:lan
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://10.0.2.2:8000/api/v1}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - ./src:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  expo-tunnel:
    build:
      context: ./src
      target: dev
    working_dir: /app
    command: npm run start:tunnel
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://10.0.2.2:8000/api/v1}
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./src:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    profiles:
      - tunnel

  web:
    build:
      context: ./src
      target: web
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-/api/v1}
    ports:
      - "8088:80"
    profiles:
      - web

  build-notify:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: build-notify
    environment:
      EXPO_TOKEN: ${EXPO_TOKEN:?set EXPO_TOKEN to an EAS access token}
      EAS_BUILD_PROFILE: ${EAS_BUILD_PROFILE:-preview}
      # "smtp" (default) or "brevo" - same switch as the backend's own
      # EMAIL_PROVIDER (app/services/email.py). Only the vars for the
      # chosen provider actually need real values; scripts/build-and-
      # notify.mjs only requires the other provider's set, not both, so
      # neither set uses Compose's ":?" hard-require here.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:?set MAIL_TO}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Šoma360}
    profiles:
      - build-notify

volumes:
  mobile_node_modules:
