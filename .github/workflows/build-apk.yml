# name: Build and notify

# # Runs the same build-and-notify.mjs flow the local
# # "docker compose --profile build-notify run build-notify" already uses
# # (see mobile/docker-compose.yml + mobile/src/Dockerfile's build-notify
# # stage) - a real EAS cloud build, waited on synchronously, then one
# # email with the finished APK's download link. This workflow just runs
# # that same script on GitHub's own runner instead of a local container,
# # so a push doesn't depend on someone's machine being on.
# on:
#   push:
#     branches:
#       - subscription

# # A build already running for this branch is superseded by a newer push
# # rather than left to race it - two builds for the same branch/profile
# # racing each other just burns EAS build minutes for a result the
# # newer commit will make stale anyway. cancel-in-progress: true is safe
# # here specifically because build-and-notify.mjs's eas build call is the
# # only externally-visible side effect this job has (no deploy step, no
# # artifact other than the emailed link) - cancelling it mid-flight
# # leaves nothing half-applied.
# concurrency:
#   group: build-apk-${{ github.ref }}
#   cancel-in-progress: true

