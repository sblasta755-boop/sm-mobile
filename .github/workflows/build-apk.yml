#     # exactly this ceiling ("The job has exceeded the maximum execution
#     # time of 1h0m0s") and was killed mid-build. EAS's free/default build
#     # queue alone can run past an hour at busy times, before the actual
#     # Android build even starts, so the old estimate badly underweighted
#     # queue time. 6h leaves real headroom for that without ever
#     # approaching GitHub's own hard per-job cap.
